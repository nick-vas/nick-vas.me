# Modern TLS settings for nick-vas.me, for the HTTPS (:443) server block.
#
# certbot --nginx creates the :443 block and adds
#   include /etc/letsencrypt/options-ssl-nginx.conf;
# which (current certbot) already sets TLS 1.2/1.3 and a strong cipher list. This file adds
# what that include omits (OCSP stapling, session cache) and re-asserts the protocol floor,
# because Ubuntu's stock /etc/nginx/nginx.conf still lists `ssl_protocols TLSv1 TLSv1.1 ...`.
#
# After running certbot once, add inside the :443 server block:
#   include /etc/nginx/snippets/nick-vas-tls.conf;
#   sudo cp deploy/nginx/tls.conf /etc/nginx/snippets/nick-vas-tls.conf
# Also delete TLSv1 and TLSv1.1 from the ssl_protocols line in /etc/nginx/nginx.conf.

# Refuse the obsolete TLS 1.0 / 1.1 (BEAST/POODLE-era); keep 1.2 and 1.3.
ssl_protocols TLSv1.2 TLSv1.3;

# Let the client pick among the strong suites below (recommended with TLS 1.3 present).
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Session resumption: faster repeat handshakes. Tickets off for forward secrecy.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling: the server fetches and attaches the cert's revocation status, so the
# browser needn't contact the CA. Needs the chain Let's Encrypt's fullchain.pem provides.
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
