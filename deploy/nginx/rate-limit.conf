# Rate- and connection-limit zones for nick-vas.me.
# These define shared-memory zones and MUST live in the http context, so this file goes in
# /etc/nginx/conf.d/ (the stock nginx.conf includes /etc/nginx/conf.d/*.conf). The matching
# limit_req / limit_conn directives that USE these zones are in the server block.
#
#   sudo cp deploy/nginx/rate-limit.conf /etc/nginx/conf.d/nick-vas-rate-limit.conf
#
# Keyed on the client IP. NOTE: if you later put Cloudflare or any proxy in front, every
# request arrives from the proxy's IP, so configure real_ip (set_real_ip_from +
# real_ip_header CF-Connecting-IP) or these limits apply to the proxy, not real visitors.

# ~30 requests/second/IP sustained. A first-time browser load pulls well under this, and
# repeat visits hit the immutable cache, so real users never notice; floods do.
limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

# Concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=conns:10m;

# Answer rejected requests with 429 Too Many Requests (nginx defaults to 503).
limit_req_status 429;
limit_conn_status 429;
