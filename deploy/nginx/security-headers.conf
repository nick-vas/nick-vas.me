# Shared security headers for nick-vas.me.
#
# IMPORTANT: this file is include-d inside EACH location block, not at the server level.
# Nginx's add_header only inherits into a location that defines no add_header of its own,
# and every location here sets its own Cache-Control. Declared at server level, these
# headers would be silently dropped on every response. Keeping them in a snippet that each
# location includes keeps the two sets side by side, so both are emitted. `always` sends
# them on error responses (e.g. 404) too.
#
# Install on the droplet:
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/nick-vas-security.conf
# and include that path from each location (see nick-vas.me.conf).

# Don't let the browser guess a response's type (blocks MIME-confusion attacks).
add_header X-Content-Type-Options "nosniff" always;

# Don't let other sites frame this one (clickjacking). CSP frame-ancestors below covers
# modern browsers; this covers older ones.
add_header X-Frame-Options "DENY" always;

# Only send the origin (not the full path) as the referrer to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Opt out of Google FLoC / Topics and don't claim any powerful features.
add_header Permissions-Policy "interest-cohort=(), geolocation=(), microphone=(), camera=()" always;

# Content Security Policy. The site loads only from itself; the only external reference is
# a plain footer link. Inline <script>/<style> come from the PaperMod theme and the
# view-transition rule, so inline is allowed but nothing off-origin is. To tighten script
# further, replace 'unsafe-inline' under script-src with per-script sha256 hashes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS: tell browsers to use HTTPS only. Harmless over plain HTTP (ignored), takes effect
# once certbot adds the :443 listener. Add `; preload` only if you will submit to the
# HSTS preload list and never serve this domain over plain HTTP again.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
