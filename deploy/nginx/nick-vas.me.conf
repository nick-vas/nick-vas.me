# Nginx server block for nick-vas.me (static Hugo output in /var/www/nick-vas.me).
#
# Deploy the site with deploy/deploy.sh or the GitHub Actions deploy workflow (they make the
# .gz copies used by gzip_static and switch the `current` symlink atomically).
#
# Install on the droplet:
#   sudo cp deploy/nginx/nick-vas.me.conf /etc/nginx/sites-available/nick-vas.me
#   sudo ln -s /etc/nginx/sites-available/nick-vas.me /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nick-vas.me -d www.nick-vas.me   # adds HTTPS to this block
#
# Also raise the connection limit in /etc/nginx/nginx.conf (Ubuntu ships 768 per worker,
# and a 1-vCPU droplet has one worker), then reload:
#   events { worker_connections 4096; }
server {
    listen 80;
    listen [::]:80;
    server_name nick-vas.me www.nick-vas.me;

    root /var/www/nick-vas.me/current; # symlink to the live release; see deploy/CD.md
    index index.html;
    error_page 404 /404.html;

    # Don't advertise the exact nginx version in the Server header.
    server_tokens off;

    # Release idle keep-alive connections after 15s (default 75s), so slots free up sooner.
    keepalive_timeout 15s;

    # Slowloris defence: drop clients that dribble their request out. A browser sends its
    # headers/body in well under a second; an attacker holding sockets open by sending one
    # byte at a time is cut off here.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # This site serves only static files and accepts no uploads, so cap request bodies hard.
    # Oversized POSTs are rejected (413) before nginx buffers them.
    client_max_body_size 1k;

    # Per-IP rate and connection limits. Zones are defined in deploy/nginx/rate-limit.conf
    # (installed to /etc/nginx/conf.d/). burst=60 nodelay lets a first-time page load fetch
    # its handful of assets at once; sustained floods past ~30 req/s/IP get 429s.
    limit_req zone=perip burst=60 nodelay;
    limit_conn conns 30;

    # Security headers live in a snippet include-d inside EACH location below, never here.
    # nginx only inherits add_header into a location that sets none of its own, and both
    # locations set Cache-Control, so headers placed at this server level would be silently
    # dropped on every response. On the droplet install the snippet and point these includes
    # at it:  sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/nick-vas-security.conf
    # then use  include snippets/nick-vas-security.conf;  in each location.

    # Serve the .gz copies that deploy/deploy.sh makes at deploy time. Compressing the
    # 550 KB scene script on every request costs ~16 ms of CPU, which capped a 1-vCPU
    # droplet at ~60 first-time visitors a second; the pre-made copy costs nothing.
    gzip_static on;

    # Fallback for anything without a .gz copy (the background scene script drops from
    # ~550 KB to ~140 KB). HTML is always compressed once gzip is on.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    # Hide dotfiles and VCS/metadata (/.git, /.env, editor swap files) that should never
    # have shipped, without confirming they exist. The (?!well-known) exemption keeps
    # /.well-known/ reachable, which certbot's HTTP-01 renewal needs.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Files Hugo fingerprints (a 64-character content hash in the name, e.g.
    # /js/bg-scene.<hash>.js, /assets/css/stylesheet.<hash>.css). Any change produces a
    # new file name, so browsers can keep these for a year without checking back.
    location ~* "\.[0-9a-f]{64}\.(css|js)$" {
        include snippets/nick-vas-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Everything else (pages, RSS, search index, images): browsers re-check with the
    # server each time (a quick 304 when unchanged), so new posts show up right away.
    location / {
        include snippets/nick-vas-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
